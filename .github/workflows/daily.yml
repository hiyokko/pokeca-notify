name: Pokeca daily check

on:
  schedule:
    - cron: '0 0 * * *' # 09:00 Asia/Tokyo
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Discord接続テストのみ'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pokeca-daily-monitor
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test parsers and notification state
        run: python -m unittest discover -v
      - name: Check sources or send connection test
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          TEST_NOTIFICATION: ${{ inputs.test_notification }}
        run: |
          if [ "$TEST_NOTIFICATION" = "true" ]; then
            python monitor.py --github-state --test-notification
          else
            python monitor.py --github-state
          fi
